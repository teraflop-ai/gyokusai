[project]
name = "gyokusai"
version = "0.1.11"
description = "Gyokusai: A Web-Scale Text Processing Library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cugraph-cu13>=26.8.0",
    "daft[lance,openai,ray]>=0.7.25",
    "fastertext>=0.1.4",
    "flash-kmeans>=0.3.1",
    "ftfy>=6.3.1",
    "gigatoken>=0.10.0",
    "google-re2>=1.1.20251105",
    "kernels>=0.14.1",
    "lark>=1.3.1",
    "lxml>=7.0.0b1",
    "magic-html>=0.1.8",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "py-asciimath>=0.3.0",
    "py7zr>=1.1.3",
    "pyfastbloom>=0.1.0",
    "pylance>=12.0.0",
    "pylatexenc>=2.11",
    "pywhichlang>=0.1.0",
    "resiliparse>=1.0.9",
    "sentence-transformers>=6.1.0",
    "sglang==0.5.20",
    "text-dedup>=0.4.1",
    "tokenizers>=0.22.2",
    "torch>=2.13.0",
    "trafilatura>=2.2.0",
    "transformers>=5.12.1",
]

[tool.setuptools.package-data]
gyokusai = ["word_lists/*.txt"]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv]
override-dependencies = ["numba==0.65.1"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pyperf>=2.10.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
