[project]
name = "gyokusai"
version = "0.1.2"
description = "Gyokusai: A Web-Scale Text Processing Library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cugraph-cu13>=26.8.0",
    "daft[lance,openai,ray]>=0.7.16",
    "fastertext>=0.1.1",
    "flash-kmeans>=0.3.1",
    "ftfy>=6.3.1",
    "gigatoken>=0.10.0",
    "google-re2>=1.1.20251105",
    "kernels<0.15",
    "lxml>=6.1.1",
    "magic-html>=0.1.8",
    "orjson>=3.10,<4",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "py7zr>=1.1.3",
    "pydiskann>=0.5.0",
    "pyfastbloom>=0.1.0",
    "pylance>=11.0.0",
    "resiliparse>=1.0.8",
    "sentence-transformers>=5.6.0",
    "text-dedup>=0.4.1",
    "trafilatura>=2.1.0",
    "transformers>=5.6.0",
    "zvec>=0.7.0",
]

[tool.setuptools.package-data]
gyokusai = ["word_lists/*.txt"]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://pypi.nvidia.com/"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pyperf>=2.10.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
